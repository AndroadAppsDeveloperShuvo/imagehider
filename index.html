<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Steganography - Secret Message Hider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .upload-dashed { border: 2px dashed #10b981; }
        .active-tab { background-color: #10b981; color: white; }
        .inactive-tab { background-color: #d1fae5; color: #047857; }
        .dark .inactive-tab { background-color: #374151; color: #a7f3d0; }
    </style>
</head>
<body class="bg-emerald-50 dark:bg-gray-900 min-h-screen flex flex-col items-center justify-center p-4 transition-colors duration-300">

    <div class="bg-white dark:bg-gray-800 max-w-[450px] w-full rounded-[24px] px-6 py-8 shadow-2xl dark:shadow-none relative transition-colors duration-300">
        
        <!-- Gear Settings Icon for Dark Mode -->
        <button onclick="toggleTheme()" class="absolute top-6 right-6 text-gray-400 hover:text-emerald-600 dark:hover:text-emerald-400 transition-all duration-300" title="Toggle Dark Mode">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>

        <!-- Header -->
        <div class="text-center mb-6 mt-2">
            <h2 class="text-[24px] font-extrabold text-gray-900 dark:text-white flex items-center justify-center gap-2 transition-colors">
                🕵️‍♂️ Secret Pixel Pro
            </h2>
            <p class="text-[13px] text-gray-500 dark:text-gray-400 mt-1 transition-colors">ছবির পিক্সেলের ভেতরে গোপন মেসেজ লুকিয়ে রাখুন</p>
        </div>

        <!-- Mode Toggle (Hide / Reveal) -->
        <div class="flex rounded-xl overflow-hidden mb-6 p-1 bg-emerald-100 dark:bg-gray-700 transition-colors">
            <button id="tabHide" onclick="switchMode('hide')" class="flex-1 py-2 text-[14px] font-bold rounded-lg active-tab transition-all">
                🔐 Hide Message
            </button>
            <button id="tabReveal" onclick="switchMode('reveal')" class="flex-1 py-2 text-[14px] font-bold rounded-lg inactive-tab transition-all">
                👁️ Reveal Message
            </button>
        </div>

        <!-- Warning Notice -->
        <div id="warningNotice" class="bg-amber-100 dark:bg-amber-900/30 border-l-4 border-amber-500 p-3 mb-5 rounded-r-lg">
            <p class="text-[11px] text-amber-800 dark:text-amber-200 font-semibold flex gap-2">
                <span>⚠️</span>
                সোশ্যাল মিডিয়ায় (WhatsApp/Messenger) ছবি পাঠালে 'Document' হিসেবে পাঠাবেন। নরমাল ছবি হিসেবে পাঠালে মেসেজ মুছে যাবে!
            </p>
        </div>

        <!-- Upload Area -->
        <label id="uploadArea" class="flex flex-col items-center justify-center w-full py-8 px-4 upload-dashed rounded-[16px] cursor-pointer bg-white dark:bg-gray-800 hover:bg-emerald-50 dark:hover:bg-gray-700 transition-all mb-5">
            <div class="bg-emerald-500 p-3 rounded-full mb-3 shadow-md">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
            </div>
            <p id="uploadTitle" class="text-[15px] font-bold text-gray-800 dark:text-white mb-1 transition-colors">যেকোনো ছবি আপলোড করুন</p>
            <p class="text-[12px] text-gray-500 dark:text-gray-400 text-center transition-colors">PNG or JPG (Max 5MB)</p>
            <input id="fileInput" type="file" accept="image/png, image/jpeg, image/jpg" class="hidden" onchange="handleFile(event)" />
        </label>

        <!-- Workspace (Hidden Initially) -->
        <div id="workspace" class="hidden">
            <!-- Preview Image -->
            <div class="mb-4 flex flex-col items-center bg-gray-50 dark:bg-gray-700 p-2 rounded-xl border border-gray-200 dark:border-gray-600 transition-colors">
                <img id="imagePreview" class="max-w-full h-32 object-contain rounded-lg shadow-sm" src="" alt="Preview">
                <p id="fileName" class="text-[11px] text-gray-500 dark:text-gray-300 mt-2 font-semibold truncate w-full text-center px-2"></p>
            </div>

            <!-- Hide Mode: Text Input Area -->
            <div id="hideSection" class="mb-5">
                <label class="block text-[13px] font-bold text-gray-700 dark:text-gray-300 mb-2 transition-colors">গোপন মেসেজ লিখুন:</label>
                <textarea id="secretMessage" rows="3" placeholder="I am Batman..." class="w-full bg-gray-50 dark:bg-gray-900 border border-gray-300 dark:border-gray-600 rounded-xl p-3 text-[14px] text-gray-800 dark:text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition-colors resize-none"></textarea>
            </div>

            <!-- Reveal Mode: Output Area -->
            <div id="revealSection" class="mb-5 hidden">
                <label class="block text-[13px] font-bold text-emerald-600 dark:text-emerald-400 mb-2 transition-colors">উদ্ধার করা মেসেজ:</label>
                
                <!-- Live Scanning Progress Bar -->
                <div id="scanProgressContainer" class="hidden mb-3">
                    <div class="flex justify-between items-center text-[11px] font-bold text-emerald-600 dark:text-emerald-400 mb-1.5">
                        <span class="flex items-center gap-1.5">
                            <!-- SVG Spinner -->
                            <svg class="animate-spin w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10" stroke-width="3" stroke-dasharray="32" stroke-linecap="round"></circle></svg>
                            Scanning pixels...
                        </span>
                        <span id="scanPercent">0%</span>
                    </div>
                    <div class="w-full bg-emerald-100 dark:bg-emerald-900 rounded-full h-1.5 overflow-hidden">
                        <div id="scanProgressBar" class="bg-emerald-500 h-1.5 rounded-full transition-all duration-100" style="width: 0%"></div>
                    </div>
                </div>

                <div id="revealedText" class="w-full bg-emerald-50 dark:bg-emerald-900/30 border border-emerald-200 dark:border-emerald-800 rounded-xl p-4 text-[14px] text-gray-800 dark:text-white font-medium min-h-[80px] break-words whitespace-pre-wrap select-all">
                </div>
            </div>

            <!-- Actions -->
            <button id="actionBtn" onclick="processImage()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 px-4 rounded-xl text-[15px] transition-all shadow-lg active:scale-95 disabled:opacity-50">
                🔒 Hide Text & Download PNG
            </button>

            <!-- Status & Reset -->
            <p id="statusMsg" class="text-center text-[13px] font-bold mt-4 hidden"></p>
            <button onclick="resetApp()" class="w-full mt-3 text-[13px] font-bold text-gray-500 hover:text-gray-800 dark:hover:text-gray-200 transition-colors">
                Cancel / Reset
            </button>
        </div>

        <canvas id="canvas" class="hidden"></canvas>

        <p class="text-center text-[13px] font-bold text-gray-400 dark:text-gray-500 mt-8 transition-colors">
            Developed by <span class="text-emerald-500">Developer Shuvo</span>
        </p>
    </div>

    <script>
        let currentMode = 'hide';
        let originalImage = new Image();
        let selectedFileName = "";
        const DELIMITER = ':::SHUVO_END:::';

        const tabHide = document.getElementById('tabHide');
        const tabReveal = document.getElementById('tabReveal');
        const uploadArea = document.getElementById('uploadArea');
        const workspace = document.getElementById('workspace');
        const imagePreview = document.getElementById('imagePreview');
        const fileNameDisplay = document.getElementById('fileName');
        const hideSection = document.getElementById('hideSection');
        const revealSection = document.getElementById('revealSection');
        const secretMessageInput = document.getElementById('secretMessage');
        const revealedTextDisplay = document.getElementById('revealedText');
        const actionBtn = document.getElementById('actionBtn');
        const statusMsg = document.getElementById('statusMsg');
        const warningNotice = document.getElementById('warningNotice');
        const fileInput = document.getElementById('fileInput');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        
        // Progress Bar Elements
        const scanProgressContainer = document.getElementById('scanProgressContainer');
        const scanPercent = document.getElementById('scanPercent');
        const scanProgressBar = document.getElementById('scanProgressBar');

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
        }

        function switchMode(mode) {
            currentMode = mode;
            resetApp();

            if (mode === 'hide') {
                tabHide.className = "flex-1 py-2 text-[14px] font-bold rounded-lg active-tab transition-all";
                tabReveal.className = "flex-1 py-2 text-[14px] font-bold rounded-lg inactive-tab transition-all";
                document.getElementById('uploadTitle').innerText = "ছবি আপলোড করুন (লুকানোর জন্য)";
                warningNotice.classList.remove('hidden');
            } else {
                tabReveal.className = "flex-1 py-2 text-[14px] font-bold rounded-lg active-tab transition-all";
                tabHide.className = "flex-1 py-2 text-[14px] font-bold rounded-lg inactive-tab transition-all";
                document.getElementById('uploadTitle').innerText = "লুকানো মেসেজওয়ালা ছবি সিলেক্ট করুন";
                warningNotice.classList.add('hidden');
            }
        }

        function handleFile(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) { 
                showStatus("❌ ফাইল সাইজ অনেক বড়! সর্বোচ্চ 5MB সাপোর্ট করে।", "red");
                return;
            }

            selectedFileName = file.name.split('.')[0];
            const reader = new FileReader();

            reader.onload = function(e) {
                originalImage.onload = function() {
                    uploadArea.classList.add('hidden');
                    workspace.classList.remove('hidden');
                    
                    imagePreview.src = e.target.result;
                    fileNameDisplay.innerText = file.name;
                    
                    if (currentMode === 'hide') {
                        hideSection.classList.remove('hidden');
                        revealSection.classList.add('hidden');
                        actionBtn.classList.remove('hidden');
                        actionBtn.innerText = "🔒 Hide Text & Download PNG";
                        secretMessageInput.value = "";
                    } else {
                        hideSection.classList.add('hidden');
                        revealSection.classList.remove('hidden');
                        actionBtn.classList.add('hidden');
                        
                        // Start async scanning
                        setTimeout(decodeMessageAsync, 100); 
                    }
                }
                originalImage.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function resetApp() {
            fileInput.value = "";
            uploadArea.classList.remove('hidden');
            workspace.classList.add('hidden');
            statusMsg.classList.add('hidden');
            scanProgressContainer.classList.add('hidden');
            actionBtn.disabled = false;
        }

        function showStatus(text, color) {
            statusMsg.innerText = text;
            statusMsg.className = `text-center text-[13px] font-bold mt-3 text-${color}-500`;
            statusMsg.classList.remove('hidden');
        }

        function textToBinary(text) {
            const utf8 = unescape(encodeURIComponent(text));
            let binary = '';
            for (let i = 0; i < utf8.length; i++) {
                let bin = utf8.charCodeAt(i).toString(2);
                binary += '0'.repeat(8 - bin.length) + bin;
            }
            return binary;
        }

        function processImage() {
            if (currentMode === 'hide') encodeMessage();
        }

        function encodeMessage() {
            const message = secretMessageInput.value.trim();
            if (!message) {
                showStatus("❌ আগে গোপন মেসেজ লিখুন!", "red");
                return;
            }

            actionBtn.innerText = "Processing...";
            actionBtn.disabled = true;

            setTimeout(() => {
                try {
                    canvas.width = originalImage.width;
                    canvas.height = originalImage.height;
                    ctx.drawImage(originalImage, 0, 0);

                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;

                    const fullMessage = message + DELIMITER;
                    const binaryMsg = textToBinary(fullMessage);

                    if (binaryMsg.length > (data.length / 4) * 3) {
                        showStatus("❌ মেসেজ অনেক বড়! আরও বড় সাইজের ছবি ব্যবহার করুন।", "red");
                        actionBtn.innerText = "🔒 Hide Text & Download PNG";
                        actionBtn.disabled = false;
                        return;
                    }

                    let msgIndex = 0;
                    for (let i = 0; i < data.length; i += 4) {
                        for (let j = 0; j < 3; j++) { 
                            if (msgIndex < binaryMsg.length) {
                                data[i + j] = (data[i + j] & 254) | parseInt(binaryMsg[msgIndex]);
                                msgIndex++;
                            }
                        }
                        if (msgIndex >= binaryMsg.length) break;
                    }

                    ctx.putImageData(imgData, 0, 0);

                    canvas.toBlob(async function(blob) {
                        await triggerDownload(blob, selectedFileName + "_Secret.png");
                        showStatus("✅ মেসেজ হাইড করে সেভ করা হয়েছে!", "green");
                        actionBtn.innerText = "🔒 Hide Text & Download PNG";
                        actionBtn.disabled = false;
                    }, 'image/png');

                } catch (err) {
                    showStatus("❌ প্রসেস করতে সমস্যা হয়েছে!", "red");
                    actionBtn.disabled = false;
                }
            }, 50);
        }

        // --- ASYNC DECODE LOGIC (Fixes Freezing & Shows Progress) ---
        function decodeMessageAsync() {
            try {
                canvas.width = originalImage.width;
                canvas.height = originalImage.height;
                ctx.drawImage(originalImage, 0, 0);

                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const data = imgData.data;

                let binaryMsg = '';
                let decodedText = '';
                let isFound = false;
                
                let i = 0;
                // How many pixels to scan per frame (higher = faster but slightly jerky UI)
                const chunkSize = 300000; 
                const maxNoiseLength = 200000; // Stop if it reads 200k characters of garbage

                // Show UI
                revealedTextDisplay.innerText = "Please wait...";
                revealedTextDisplay.classList.remove('text-red-500');
                scanProgressContainer.classList.remove('hidden');
                scanPercent.innerText = "0%";
                scanProgressBar.style.width = "0%";

                function scanChunk() {
                    let end = Math.min(i + chunkSize, data.length);

                    for (; i < end; i += 4) {
                        for (let j = 0; j < 3; j++) {
                            binaryMsg += (data[i + j] & 1).toString();
                            
                            if (binaryMsg.length === 8) {
                                decodedText += String.fromCharCode(parseInt(binaryMsg, 2));
                                binaryMsg = '';
                                
                                if (decodedText.endsWith(DELIMITER)) {
                                    isFound = true;
                                    break;
                                }
                            }
                        }
                        if (isFound) break;
                    }

                    // Calculate Progress
                    let progress = Math.min(100, Math.round((i / data.length) * 100));
                    scanPercent.innerText = progress + "%";
                    scanProgressBar.style.width = progress + "%";

                    if (isFound) {
                        finalizeDecode(true, decodedText);
                    } else if (decodedText.length > maxNoiseLength) {
                        // Abort early if reading too much garbage (prevents memory crash)
                        finalizeDecode(false, null);
                    } else if (i < data.length) {
                        // Let browser render the progress bar, then process next chunk
                        requestAnimationFrame(scanChunk);
                    } else {
                        // Scanned 100% and found nothing
                        finalizeDecode(false, null);
                    }
                }
                
                // Start the scanning loop
                requestAnimationFrame(scanChunk);

            } catch (err) {
                revealedTextDisplay.innerText = "Error decoding image.";
                showStatus("❌ ডিকোড করতে সমস্যা হয়েছে!", "red");
                scanProgressContainer.classList.add('hidden');
            }
        }

        function finalizeDecode(isFound, decodedText) {
            scanProgressContainer.classList.add('hidden');

            if (isFound) {
                let finalText = decodedText.slice(0, -DELIMITER.length);
                try {
                    finalText = decodeURIComponent(escape(finalText));
                } catch (e) {} 
                
                revealedTextDisplay.innerText = finalText;
                revealedTextDisplay.classList.remove('text-red-500');
                showStatus("✅ গোপন মেসেজ পাওয়া গেছে!", "green");
            } else {
                revealedTextDisplay.innerText = "No secret message found in this image. 😢\n\n(হয়তো এটি নরমাল ছবি, অথবা WhatsApp/Messenger এ পাঠানোর কারণে পিক্সেল নষ্ট হয়ে গেছে)";
                revealedTextDisplay.classList.add('text-red-500');
                showStatus("❌ কোনো মেসেজ পাওয়া যায়নি!", "red");
            }
        }

        async function triggerDownload(blob, filename) {
            const file = new File([blob], filename, { type: "image/png" });
            if (navigator.canShare && navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({ files: [file], title: 'Secret Image' });
                    return;
                } catch (err) { console.log("Share cancelled."); }
            }
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }
    </script>
</body>
</html>
